# Render Blueprint (SRS 14.1): the API and sync service as one free web service. The database
# is on Neon (Render's free Postgres expires after 30 days). In Render: New → Blueprint → this repo.
services:
  - type: web
    name: shelf-life-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (ends with ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Random secrets Render generates once and keeps.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SYNC_JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://<your Vercel domain>
      - key: APP_URL
        sync: false
      # wss://<this service's onrender.com host>/sync
      - key: SYNC_URL
        sync: false
      # Optional: Gemini API key (Google AI Studio, free). Without it AI is off and the app uses
      # its non-AI fallbacks.
      - key: GEMINI_API_KEY
        sync: false
      # Optional: Web Push keys (`npx web-push generate-vapid-keys`). Without them phone
      # notifications are off and reminders stay in the app.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # mailto:you@example.com: who push services can contact about this app's pushes.
      - key: VAPID_SUBJECT
        sync: false
